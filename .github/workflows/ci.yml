name: Build and test

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Julia ${{ matrix.julia }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            julia: '1.10'
          - os: ubuntu-latest
            julia: '1.13.2'
          - os: macos-15
            julia: '1.13.2'
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia }}
      - name: Load Julia package before building the backend
        env:
          PERFECT_FORMS_SKIP_BUILD: 'true'
        run: |
          julia --startup-file=no --project=. -e '
            using Pkg
            Pkg.instantiate()
            using PerfectForms
            @assert !isfile(joinpath(pkgdir(PerfectForms), "backend", "config.json"))
          '
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libgmp-dev libeigen3-dev libboost-serialization-dev libnauty-dev
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja pkgconf gmp eigen@3 boost nauty
          echo "CMAKE_PREFIX_PATH=$(brew --prefix eigen@3):$(brew --prefix)" >> "$GITHUB_ENV"
      - name: Install through Pkg and test the automatic build
        run: |
          julia --startup-file=no -e '
            using Pkg
            Pkg.activate(; temp=true)
            Pkg.add(url=pwd())
            using PerfectForms
            @assert !isfile(joinpath(pkgdir(PerfectForms), "backend", "config.json"))
            build_dir = backend_build_info()["build_directory"]
            run(`ctest --test-dir $build_dir --output-on-failure`)
            Pkg.test("PerfectForms")
          '
